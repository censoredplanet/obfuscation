[package]
name = "obfs"
version = "0.1.0"
edition = "2024"

[dependencies]
atoi = "2.0.0"
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.5"
foldhash = "0.2.0"
hashbrown = { version = "0.16.1", features = ["rayon", "serde"] }
itertools = "0.14.0"
itoa = "1.0.15"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9.2"
rayon = "1.11.0"
rustc-hash = "2.1.1"
rv = "0.19.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = "3.16.1"
tdigest = { version = "0.2.3", features = ["serde", "use_serde"] }
tikv-jemallocator = "0.6.1"
toml = { version = "0.9.11", features = ["serde"] }
winnow = "0.7.14"
zmij = "1.0.12"
zstd = "0.13.3"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
